  <link rel="stylesheet" href="styles.css">
  <style>
    /* Gallery: a fixed collage that scales with the screen, so the arrangement is the same on phone and desktop. */
    .gallery { position: relative; width: 100%; max-width: 46rem; margin: 0 auto 2rem; aspect-ratio: 436 / 521; }
    .g-tile { position: absolute; overflow: hidden; border-radius: 8px; border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(119,143,229,.10), rgba(248,164,130,.07) 50%, rgba(63,163,151,.10)), var(--panel); }
    .g-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .g-tile:not(:has(img))::after { content: attr(data-label); position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: .25rem;
      font-family: var(--font-sans); font-size: clamp(.5625rem, 1.9vw, .8125rem); color: var(--dim); }

  .g-f{left:33.03%;top:37.04%;width:15.83%;height:18.23%}

  .g-j{left:50.92%;top:83.69%;width:16.06%;height:16.31%}
  .g-k{left:69.27%;top:0.00%;width:30.73%;height:35.32%}
  .g-l{left:50.92%;top:37.04%;width:49.08%;height:25.91%}
  .g-m{left:69.27%;top:64.68%;width:30.73%;height:35.32%}
    .home-link { display: flex; justify-content: center; padding-bottom: 2.5rem; margin: 0; }
    .home-link a { font-family: var(--font-sans); font-size: .8125rem; line-height: 1; color: var(--dim); text-decoration: underline; text-underline-offset: .25em; text-decoration-thickness: 1px; padding: .9rem .75rem; min-height: 44px; display: inline-flex; align-items: center; transition: color var(--fade); }
    .home-link a:hover { color: var(--text); }

</head>

    <p class="home-link"><a href="index.html">Back to home</a></p>

  <script>
    // If the visitor came from the Home page, "Back" uses the browser's history,
    // so the browser's back arrow and this button always behave the same way.
    document.getElementById('back').addEventListener('click', function (e) {
      try {
        if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) {
          e.preventDefault();
          history.back();
        }
      } catch (err) { /* falls back to the normal link */ }
    });
  </script>
